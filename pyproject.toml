[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minisgl"
version = "0.1.0"
description = "An educational LLM inference engine with paged KV caching and overlap scheduling."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.9,<2.10",
    "transformers>=4.56,<=4.57.3",
    "flashinfer-python>=0.7.2,<0.8",
    "sgl-kernel>=0.3.21,<0.4",
    "triton>=3.5,<3.6",
    "huggingface-hub",
    "safetensors",
    "numpy",
    "tqdm",
    "msgpack",
    "pyzmq",
    "uvicorn",
    "fastapi",
    "pydantic>=2,<3",
    "prompt-toolkit",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.17,<0.18"]
benchmark = ["openai", "pyarrow"]

[project.urls]
Repository = "https://github.com/akjindal53244/mini-sglang"
Upstream = "https://github.com/sgl-project/mini-sglang"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["F", "I", "C4", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
